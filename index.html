<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пронин Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ======== ШАПКА: 3 ПЛАШКИ ======== -->
<header class="topbar">
  <nav class="tabs" id="tabs">
    <button class="tab tab-side" data-tab="video" type="button">
      <span class="tab-ic">▶</span>
      <span class="tab-name">Видео</span>
    </button>

    <button class="tab tab-course is-active" data-tab="course" type="button">
      <span class="tab-name">Курс</span>
    </button>

    <button class="tab tab-side" data-tab="materials" type="button">
      <span class="tab-ic">◆</span>
      <span class="tab-name">Материалы</span>
    </button>
  </nav>
  <button class="admin-btn" id="adminBtn" type="button" hidden aria-label="Редактировать">⚙</button>
</header>

<main id="app">

  <!-- ======== ВКЛАДКА: КУРС ======== -->
  <section class="page is-active" id="page-course">
    <div class="wrap" id="courseRoot"></div>
  </section>

  <!-- ======== ВКЛАДКА: ВИДЕО ======== -->
  <section class="page" id="page-video">
    <div class="wrap">
      <div class="page-head">
        <h1 class="page-title">Видео</h1>
        <p class="page-sub">Разборы и записи с YouTube.</p>
      </div>
      <div class="grid" id="videoRoot"></div>
    </div>
  </section>

  <!-- ======== ВКЛАДКА: МАТЕРИАЛЫ ======== -->
  <section class="page" id="page-materials">
    <div class="wrap">
      <div class="page-head">
        <h1 class="page-title">Материалы</h1>
        <p class="page-sub">Шрифты, сервисы и ссылки к курсу.</p>
      </div>
      <div id="materialsRoot"></div>
    </div>
  </section>

</main>

<div class="loader" id="loader"><span class="spin"></span></div>

<!-- ======== ПАНЕЛЬ РЕДАКТОРА ======== -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="sheet-back" id="sheetBack" type="button" hidden>‹</button>
    <h2 class="sheet-title" id="sheetTitle">Редактор</h2>
    <button class="sheet-close" id="sheetClose" type="button">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
